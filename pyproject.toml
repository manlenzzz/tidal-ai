[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal-ai"
version = "0.1.0"
description = "Efficient LLM training, compression, and serving toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "PyYAML"]

[project.scripts]
tidal = "tidal.cli.main:main"

[project.optional-dependencies]
torch = ["torch", "peft", "transformers", "accelerate"]

[tool.setuptools.packages.find]
include = ["tidal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
